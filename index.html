<style>
/* =========================================================================
   ARBA DESTINATION KB — SHARED STYLE (DO NOT EDIT PER DESTINATION)

:root{
  color-scheme: light;
  --ink:#1c1c1c; --muted:#6b6b6b; --line:#e6e6e6; --bg:#ffffff; --soft:#f7f7f7;
  --green:#c8172b; --green2:#e23744; --greend:#a01223; --greensoft:#fdebed;
  --halal:#0a7d63; --star:#c8172b;
  --sea1:#0e5c53; --sea2:#0a7d63;
  --shadow:0 1px 2px rgba(0,0,0,.03),0 3px 12px rgba(0,0,0,.05);
  --shadow-lg:0 10px 30px rgba(0,0,0,.11);
  --r:18px;
}
*{box-sizing:border-box}
html{scroll-padding-top:112px}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Poppins","Trebuchet MS",-apple-system,BlinkMacSystemFont,"Segoe UI",Verdana,Arial,sans-serif;
  font-size:15px;line-height:1.5}
a{color:var(--green)}
.wrap{max-width:1080px;margin:0 auto;padding:0 18px 90px}
.topbar{position:sticky;top:0;z-index:60;background:#fff;border-bottom:1px solid var(--line)}
.topbar .in{max-width:1080px;margin:0 auto;padding:11px 18px;display:flex;align-items:center;gap:16px}
.logo{white-space:nowrap;display:flex;align-items:center;gap:12px;text-decoration:none}
.brandmark{display:inline-flex;flex-direction:column;align-items:center;line-height:.85;color:var(--green);font-weight:800}
.brandmark>.big{font-size:24px;letter-spacing:.5px}
.brandmark>.sub{font-size:8px;letter-spacing:5px;font-weight:700;margin-top:3px}
.kbtag{font-size:12.5px;color:var(--muted);font-weight:700;border-left:1px solid var(--line);padding-left:12px}
.miniS{flex:1;max-width:520px;margin-left:auto;position:relative}
.miniS input{width:100%;padding:10px 14px 10px 40px;border:1px solid #d9d9d9;border-radius:999px;font-size:14px;outline:none;background:#fff}
.miniS input:focus{border-color:var(--ink);box-shadow:0 2px 10px rgba(0,0,0,.08)}
.miniS .i{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted)}
.hero{position:relative;border-radius:24px;overflow:hidden;margin-top:22px;min-height:340px;display:flex;align-items:center;justify-content:center;text-align:center;box-shadow:var(--shadow)}
.hero .bg{position:absolute;inset:0;background:linear-gradient(135deg,var(--sea1),var(--sea2))}
.hero .bg img{width:100%;height:100%;object-fit:cover;display:block}

.hero .in{position:relative;color:#fff;padding:46px 22px;width:100%;max-width:640px}
.kicker{font-size:11.5px;letter-spacing:3px;font-weight:800;text-transform:uppercase;opacity:.9;margin-bottom:14px}

.bigsearch{position:relative;background:#fff;border-radius:999px;box-shadow:0 10px 34px rgba(0,0,0,.24);display:flex;align-items:center;padding:6px 6px 6px 20px;max-width:560px;margin:0 auto}

.tcard .body{padding:13px 14px 15px}

  font-weight:800;font-size:13px;padding:8px 16px;border-radius:999px;transition:.14s}

section.block{background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px 24px;margin-top:16px;box-shadow:0 1px 3px rgba(0,0,0,.04)}

mark{background:#fff3ba;padding:0 2px;border-radius:3px}
.badge-halal{display:inline-block;background:#eaf7f0;color:var(--halal);border:1px solid #c7ebda;font-size:11px;font-weight:800;padding:1px 8px;border-radius:999px;margin-left:6px;vertical-align:middle}

  "snapshot": "# PT Phuket — Knowledge Base (Important Notes · FAQ)\n\n## 1. IMPORTANT NOTES (Polisi Pakej)\n\n*PT Phuket 4D3N — 2 varian: **Standard** (semua island tour + city tour) & **Budget** (pilih 1 island tour). Kedua-dua private tour, ground-only (tanpa tiket flight).*\n\n- Semua harga sah **24 jam** selepas quotation dihantar (kadar operator boleh berubah).\n- Harga untuk **2–3 orang sebilik**. Single Supplement: **+RM450/pax** (3★) atau **+RM300/pax** (4★).\n- **Deposit RM250/pax** semasa confirmation. **Full payment 45 hari** sebelum travel date.\n- **Late Booking Surcharge RM50/booking** jika tempah <45 hari sebelum berlepas.\n- Private transport & tour guide asas **10 jam/hari**; jam lebih dicaj (bayar **tunai**).\n- **Peak Season:** STD 11 Jan–30 Apr 2026 +RM250/pax · Super Peak 21 Dis 2026–10 Jan 2027 +RM300/pax · Budget 1 Nov–31 Dis 2026 +RM300/pax. May–Jun tiada surcharge.\n- **Upgrade hotel 4★:** +RM240/pax. Budget upgrade Phi Phi (Hari 3): +RM100/pax.\n- Itinerari & hotel muktamad **15 hari** sebelum trip; itinerari/harga tertakluk perubahan.\n- **TDAC (Thailand Digital Arrival Card) WAJIB** untuk semua pelancong — isi online di tdac.immigration.go.th dalam tempoh **3 hari** sebelum ketibaan (setiap orang termasuk kanak-kanak).\n- Passport sah **minimum 6 bulan** dari tarikh berlepas.\n- Sila semak validity trip dengan staff sebelum booking sebarang connecting domestic flight.\n- **Dinner tidak disediakan** (fullboard = 3 Breakfast & 2 Lunch) — customer bebas explore makan malam.\n- Pakej sah untuk perjalanan hingga **31 Disember 2026**.\n\n## 3. FAQ\n\n### A. Pakej & Itinerari\n\n**Ada berapa pakej Phuket?**\nDua: (1) **Standard 4D3N** — termasuk semua 3 island tour (Racha & Coral, James Bond + canoe, Phi Phi) + Phuket City Tour; (2) **Budget 4D3N** — Racha & Coral (Hari 2) + pilih SATU tour Hari 3 (Phi Phi +RM100/pax ATAU James Bond + canoe). Kedua-dua private tour, ground-only.\n\n**Beza Standard dengan Budget?**\nStandard rasa semua highlight (3 island tour + city tour, RM1,797). Budget lebih murah (RM1,397) tapi pilih 1 tour utama pada Hari 3 dan tiada city tour. Budget dari operator hanya untuk musim rendah (May–Okt).\n\n**Pakej Phuket dah termasuk tiket flight?**\nBelum — ini pakej private **ground-only**. Customer boleh book flight sendiri atau minta ARBA quote bundle flight + ground.\n\n**Boleh customize itinerari?**\nBoleh — ini private tour. Boleh tambah spot (Big Buddha, Wat Chalong, Andamanda Waterpark), tukar hotel, atau tambah malam. Maklum consultant awal; itinerari muktamad 15 hari sebelum trip.\n\n**Berapa lama tour setiap hari?**\nTransport & guide asas 10 jam/hari. Jam lebih dicaj (bayar tunai). Island tour biasanya penuh sehari.\n\n**Island hopping sesuai untuk semua?**\nSesuai untuk kebanyakan orang, TAPI **tidak digalakkan untuk warga emas, wanita mengandung atau yang ada masalah kesihatan** — perjalanan speedboat mencabar & berombak.\n\n### B. Halal, Makanan & Solat\n\n**Makanan halal senang dapat di Phuket?**\nSangat mudah — Phuket ada komuniti Muslim yang besar. Restoran & gerai halal banyak di **Patong, Phuket Old Town, Kata dan Chalong**. Banzaan Market (Patong) ada gerai halal.\n\n**Lunch dalam island tour halal?**\nLunch disediakan semasa island tour (Coral Island / Phi Phi Don). ARBA maklum operator awal untuk sediakan pilihan **halal/seafood**. Sahkan dengan consultant semasa booking; bawa snack sebagai backup.\n\n**Kenapa dinner tak included?**\nFullboard pakej = 3 Breakfast + 2 Lunch. Dinner sengaja exclude supaya customer bebas explore makan malam Phuket (halal mudah di Patong & Old Town).\n\n**Macam mana nak solat? Ada masjid/surau?**\nDi pulau (Phi Phi, James Bond, Coral) **tiada masjid** — solat jamak/qasar di bot atau kawasan rehat, bawa sejadah travel & ambil wuduk awal. Di darat: **Masjid Patong (Nanai Road)** & Al-Madani Mosque; ada prayer room di Phuket Airport & Central Festival mall.\n\n**Perlu bawa telekung/sejadah sendiri?**\nSangat digalakkan — bawa telekung & sejadah travel kerana kebanyakan attraction pulau tiada surau.\n\n**Waktu solat sama dengan Malaysia?**\nThailand 1 jam lebih lewat dari Malaysia. Waktu solat lebih kurang sama; ikut jadual tempatan yang guide kongsi.\n\n### C. Visa & Passport\n\n**Perlu visa ke Thailand?**\nTidak. Warganegara Malaysia **bebas visa sehingga 30 hari** (masuk melalui udara) di bawah perjanjian ASEAN.\n\n**Apa itu TDAC & wajib ke?**\nYa, **wajib**. Thailand Digital Arrival Card (TDAC) menggantikan kad kertas TM6. Isi online **percuma** di tdac.immigration.go.th dalam tempoh **3 hari** sebelum ketibaan. **Setiap orang** (termasuk kanak-kanak) perlu satu TDAC. Simpan QR untuk tunjuk di imigresen.\n\n**Passport kena sah berapa lama?**\nMinimum **6 bulan** dari tarikh berlepas, dengan muka surat kosong.\n\n**Bukan warganegara Malaysia macam mana?**\nBergantung kewarganegaraan — sesetengah perlu Visa on Arrival / e-Visa. Semak requirement mengikut passport & tetap perlu isi TDAC.\n\n### D. Flight & Airport\n\n**Flight termasuk dalam pakej?**\nTidak — pakej **ground-only**. ARBA boleh bantu quote bundle flight + ground.\n\n**Flight KL ke Phuket macam mana?**\nDirect **KUL–HKT ~1 jam 25–30 minit**. Banyak pilihan harian:\n\n| Airline | Nota |\n|---|---|\n| AirAsia | Banyak penerbangan harian (KLIA T2) |\n| Batik Air Malaysia | Direct ~1j 30m |\n| Malaysia Airlines | Direct, rekod ketepatan masa baik |\n\n**Sampai airport mana?**\nPhuket International Airport (**HKT**), di utara pulau (~45 min–1 jam ke Patong). Driver ARBA tunggu di Arrival dengan papan tanda.\n\n**Kena sampai airport berapa awal?**\nSekurang-kurangnya 3 jam sebelum flight antarabangsa.\n\n**Bila patut tiba Hari 1?**\nCadangan tiba **selepas 12 tengah hari**. Standard: berlepas balik cadangan selepas 4pm (ada city tour Hari 4); Budget: selepas 12 tengah hari.\n\n### E. Hotel & Bilik\n\n**Hotel apa digunakan?**\n3★ default: **Ibis Phuket Kata Beach / Tony Resort Patong / Di Pantai Boutique**. 4★ upgrade: **The Marina / Amata Patong / Best Western Patong / C&N Resort & Spa / Sleep With Me** (+RM240/pax).\n\n**Boleh upgrade hotel?**\nBoleh — 4★ +RM240/pax. Semua termasuk breakfast.\n\n**Bilik untuk family / triple?**\nStandard double/twin. Triple = extra bed (tertakluk availability). Untuk bilik family proper, maklum consultant awal.\n\n**Single occupancy macam mana?**\nSingle Supplement +RM450/pax (3★) atau +RM300/pax (4★).\n\n### F. Cuaca & Musim\n\n**Bila musim terbaik ke Phuket?**\n**November–April** (musim kering) — laut tenang, langit cerah, terbaik untuk pantai, snorkel & island hopping. Januari paling kering.\n\n**Musim hujan bila?**\n**May–Oktober** (monsun barat daya). September paling lebat. Island hopping boleh terjejas/dibatalkan jika laut bergelora. Kelebihan: harga & crowd lebih rendah.\n\n**Cuaca panas ke?**\nTropika panas lembap (~27–33°C) sepanjang tahun. Bawa sunblock, topi, cermin mata & raincoat kecil.\n\n### G. Shopping & Duit\n\n**Beli apa di Phuket?**\nProduk cashew nut, mutiara (pearl), gula-gula & snack Thai, souvenir di Old Town, Jungceylon & Banzaan Market (Patong).\n\n**Guna duit apa?**\n**Thai Baht (THB)**. Tukar di money changer Malaysia untuk kadar lebih baik. Kad diterima di kebanyakan tempat, tapi **cash lebih meluas** — banyak gerai & add-on pulau prefer tunai.\n\n**Berapa duit poket dicadangkan?**\n**RM500–RM1,500/pax** bergantung tabiat shopping & optional activities (semua meal utama sudah termasuk kecuali dinner).\n\n### H. Payment & Refund\n\n**Deposit dulu atau bayar penuh?**\nDeposit **RM250/pax** semasa confirmation. Baki (full payment) **45 hari** sebelum travel date.\n\n**Harga sah berapa lama?**\nQuotation sah **24 jam** selepas dihantar.\n\n**Late booking ada surcharge?**\nYa — **RM50/booking** jika tempah <45 hari sebelum berlepas.\n\n### I. Add-ons & Customization\n\n**Ada aktiviti tambahan popular?**\nPhuket Aquaria (RM237 adult/RM197 kid), Andamanda Waterpark (RM287/RM247), Banana Boat (RM67–87), Parasailing (RM157–197). Budget boleh upgrade Phi Phi Hari 3 (+RM100/pax).\n\n**Boleh tambah wifi / insurans / luggage tracker?**\nBoleh — Pocket Wifi RoamingMan (3GB RM80 / 10GB RM120 setrip); Takaful TripCare 360 (Individu RM45 / Couple RM79 / Family RM100); Luggage tracker Blue Ribbon RM20–70.\n\n### J. Kesihatan & Keselamatan\n\n**Selamat bawa anak & warga emas?**\nPhuket selamat & mesra keluarga. TAPI island hopping (speedboat) tidak digalakkan untuk warga emas, wanita mengandung atau yang ada masalah kesihatan — laut boleh bergelora.\n\n**Hati-hati apa di attraction?**\n**Monyet** di sesetengah viewpoint & pulau boleh agresif — jangan beri makan, jaga barang (kamera, cermin mata, beg). Ikut arahan guide semasa snorkel.\n\n**Kalau emergency?**\nGuide standby sepanjang trip; hospital tersedia di Phuket Town. Sangat digalakkan ambil travel insurance/Takaful (add-on).\n\n### K. Praktikal (SIM, Socket, Toilet)\n\n**Internet/SIM di Phuket?**\nSIM tempatan Thailand ada di airport, atau guna **roaming/eSIM**, atau **pocket wifi** RoamingMan (add-on ARBA, RM80–120/trip).\n\n**Plug socket jenis apa?**\nKebanyakan Type A/B/C — soket Thailand terima palam 2-pin flat & round. Bawa universal adaptor. Simpan power bank & charger dalam hand carry.\n\n**Toilet ada paip/hose?**\nKebanyakan toilet ada hose/bidet. Bawa botol spray kecil & tisu untuk keselesaan, terutama di pulau.\n\n### L. Packing / Barang Bawa\n\n**Barang basic untuk trip Phuket? (checklist)**\nPassport (sah ≥6 bulan) + TDAC QR, pakaian ringan menutup aurat, pakaian ibadah (telekung & sejadah travel), baju renang sopan/rashguard untuk snorkel, sunblock kalis air, topi & cermin mata, raincoat kecil, ubat mabuk laut (island hopping berombak), power bank & universal adaptor (hand carry), kasut selesa + selipar, dan duit poket RM500–RM1,500 (tukar THB di Malaysia).\n\n**Snorkeling kena bawa apa?**\nGear snorkel biasanya disediakan tour. Bawa baju renang sopan/rashguard, sunblock kalis air, baju ganti & beg kalis air untuk telefon.\n"
}

  for(let k=0;k<body.length;k++){if(/^\*[^*].*\*$/.test(body[k].trim())){sub=body[k].trim().replace(/^\*|\*$/g,"");body.splice(k,1);break;}}
  let html=sub?"<div class='subtitle'>"+esc(sub)+"</div>":"";let i=0;
  while(i<body.length){let ln=body[i];
    if(/^\s*[-*]\s+/.test(ln)){let it=[];while(i<body.length&&/^\s*[-*]\s+/.test(body[i])){it.push(body[i].replace(/^\s*[-*]\s+/,""));i++;}html+="<ul class='klist'>"+it.map(x=>"<li>"+inline(x)+"</li>").join("")+"</ul>";continue;}
    if(/^\s*\|.*\|\s*$/.test(ln)){let t=[];while(i<body.length&&/^\s*\|.*\|\s*$/.test(body[i])){t.push(body[i]);i++;}html+=renderTable(t);continue;}
    if(ln.trim())html+="<p>"+inline(ln.trim())+"</p>";i++;}
  return html;}
let CURRENT="all";

function renderHotels(){
  if(!KB.hotels||!KB.hotels.length)return"";
  return '<div class="hotels">'+KB.hotels.map(ht=>`<div class="hcard"><div class="ph">${ht.img?`<img src="${W(ht.img)}" loading="lazy" referrerpolicy="no-referrer" alt="${esc(ht.name)}" onerror="this.parentNode.textContent='🏨'">`:(ht.emoji||"🏨")}</div><div class="hb"><div class="tier">${esc(ht.tier)}</div><div class="hn">${esc(ht.name)}</div><div class="hnote">${esc(ht.note||"")}</div></div></div>`).join("")+'</div>';
}
function renderActs(){
  if(!KB.actGroups||!KB.actGroups.length)return"";
  return KB.actGroups.map(g=>'<h3 class="actcity">'+esc(g.city)+'</h3><div class="actgrid">'+g.items.map(function(it){var n=(typeof it==="string")?it:it.n;var im=(it&&it.img)?W(it.img):"";var em=(it&&it.emoji)?it.emoji:"📍";return '<div class="actcard"><div class="actim">'+(im?'<img src="'+im+'" loading="lazy" referrerpolicy="no-referrer" alt="'+esc(n)+'" onerror="this.parentNode.textContent=String.fromCodePoint(0x1F4CD)">':em)+'</div><div class="actname">'+esc(n)+'</div></div>';}).join('')+'</div>').join('');
}

function build(md){
  const secs=parse(md);const cont=$("#content");cont.innerHTML="";
  const info={},qs={};TOPICS.forEach(t=>qs[t.id]=[]);
  secs.forEach(s=>{
    if(s.type==="info"){info["polisi"]=(info["polisi"]||"")+"<div class='infosub'>"+esc(s.title.replace(/^\d+\.\s*/,""))+"</div>"+infoHtml(s);}
    else{s.cats.forEach(cat=>{const letter=(cat.title.match(/^([A-Z])\./)||[])[1];cat.qas.forEach(qa=>{qs[topicOf(letter,qa.q,qa.body)].push(qa);});});}
  });
  TOPICS.forEach(tp=>{
    if(!qs[tp.id].length && !info[tp.id])return;
    const sec=document.createElement("section");sec.className="block hidden";sec.dataset.topic=tp.id;sec.id="topic-"+tp.id;
    sec.innerHTML="<h2>"+esc(tp.t)+"</h2>"+(info[tp.id]||"");
    qs[tp.id].forEach(qa=>{const halal=HALAL_RE.test(qa.q+" "+qa.body.join(" "));
      const d=document.createElement("details");d.className="qa";d.dataset.text=(qa.q+" "+qa.body.join(" ")).toLowerCase();
      d.innerHTML="<summary><span class='tw'>▶</span><span>"+inline(qa.q)+(halal?"<span class='badge-halal'>halal/solat</span>":"")+"</span></summary><div class='ans'>"+renderBody(qa.body)+"</div>";
      sec.appendChild(d);});
    cont.appendChild(sec);
  });
  const B=KB.blocks||{};
  [["compare",B.compare],["pricing",B.pricing],["custom",B.custom],["surcharge",B.surcharge],["transport",B.transport],["stay",B.stay],["freegift",B.freegift]].forEach(function(b){
    if(!b[1])return;
    const existing=document.querySelector('.block[data-topic="'+b[0]+'"]');
    if(existing){existing.insertAdjacentHTML("beforeend",b[1].replace(/^\s*<h2>[\s\S]*?<\/h2>/,""));}
    else{const s=document.createElement("section");s.className="block hidden";s.dataset.topic=b[0];s.id="topic-"+b[0];s.innerHTML=b[1];cont.appendChild(s);}
  });
  var _stay=document.querySelector('.block[data-topic="stay"]');if(_stay)_stay.insertAdjacentHTML("beforeend",renderHotels());
  var _itin=document.querySelector('.block[data-topic="itin"]');if(_itin){var _h2=_itin.querySelector("h2");if(_h2)_h2.insertAdjacentHTML("afterend",'<p class="ssub" style="margin:8px 0 6px">Highlight aktiviti ikut kawasan</p>'+renderActs());}
  renderTabs();
  if(($("#q").value||"").trim())applyFilter();else showTopic(CURRENT);
}
function renderTabs(){
  const list=[{id:"all",t:"Overview"}].concat(TOPICS.filter(t=>document.querySelector('.block[data-topic="'+t.id+'"]')));
  $("#topicbar").innerHTML=list.map(t=>`<button class="tab${t.id===CURRENT?' active':''}" data-id="${t.id}" onclick="showTopic('${t.id}')">${esc(t.t)}</button>`).join("");
}
function showTopic(id){CURRENT=id;$("#q").value="";$("#q2").value="";
  document.querySelectorAll(".explore .tcard").forEach(c=>c.style.display="");
  const av=$("#attractionview");if(av){av.classList.add("hidden");av.innerHTML="";}
  $("#topicbar").classList.remove("hidden");
  const all=id==="all";
  document.querySelectorAll("#topicbar .tab").forEach(b=>b.classList.toggle("active",b.dataset.id===id));
  document.querySelectorAll(".explore").forEach(e=>e.classList.toggle("hidden",!all));
  document.querySelectorAll("#content .block").forEach(b=>b.classList.toggle("hidden",all||b.dataset.topic!==id));
  document.querySelectorAll("details.qa").forEach(d=>{d.classList.remove("hidden");d.open=false;});
  $("#noresult").style.display="none";
  if(all)window.scrollTo({top:0,behavior:"smooth"});
  else{const el=document.querySelector('.block[data-topic="'+id+'"]');if(el)el.scrollIntoView({behavior:"smooth",block:"start"});}
}
function applyFilter(){
  const q=($("#q").value||"").trim().toLowerCase();
  if(!q){showTopic(CURRENT);return;}
  const av=$("#attractionview");if(av){av.classList.add("hidden");av.innerHTML="";}
  $("#topicbar").classList.remove("hidden");
  document.querySelectorAll("#topicbar .tab").forEach(b=>b.classList.remove("active"));
  let any=false;
  document.querySelectorAll("details.qa").forEach(d=>{const show=d.dataset.text.includes(q);d.classList.toggle("hidden",!show);d.open=show;if(show)any=true;});
  document.querySelectorAll("#content .block").forEach(b=>{
    const hasQA=!!b.querySelector("details.qa");
    const qaMatch=hasQA && b.querySelectorAll("details.qa:not(.hidden)").length>0;
    const textMatch=(b.textContent||"").toLowerCase().includes(q);
    const show=hasQA?(qaMatch||textMatch):textMatch;
    b.classList.toggle("hidden",!show); if(show)any=true;
  });
  document.querySelectorAll(".explore").forEach(sec=>{
    let secAny=false;
    sec.querySelectorAll(".tcard").forEach(c=>{const mm=(c.textContent||"").toLowerCase().includes(q);c.style.display=mm?"":"none";if(mm)secAny=true;});
    sec.classList.toggle("hidden",!secAny); if(secAny)any=true;
  });
  $("#noresult").style.display=any?"none":"block";
}
function sync(from,to){to.value=from.value;applyFilter();}
$("#q").addEventListener("input",()=>sync($("#q"),$("#q2")));
$("#q2").addEventListener("input",()=>sync($("#q2"),$("#q")));
$("#goBtn").addEventListener("click",()=>{applyFilter();});
build(KB.snapshot);
(function(){var f=document.querySelector('.block[data-topic="flight"]');if(f&&KB.blocks&&KB.blocks.flight){var h=f.querySelector("h2");if(h)h.insertAdjacentHTML("afterend",KB.blocks.flight.replace(/^\s*<h2>[\s\S]*?<\/h2>/,""));}})();
</script>
